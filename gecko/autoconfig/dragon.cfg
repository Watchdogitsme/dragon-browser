// Dragon Browser AutoConfig
// Line 1 MUST remain a JS comment (Gecko AutoConfig skips the first line).

try {
  lockPref("xpinstall.signatures.required", false);
  defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
  defaultPref("layout.css.corner-shape.enabled", true);
} catch (err) {
  try {
    Components.utils.reportError("[Dragon AutoConfig] Failed to lock base prefs: " + err);
  } catch (_ignored) {}
}

(function initDragonAutoConfig() {
  try {
    const ServicesRef = typeof Services !== "undefined" ? Services : null;
    const CiRef = typeof Ci !== "undefined" ? Ci : Components.interfaces;
    if (!ServicesRef || !CiRef) {
      return;
    }

    function resolveDragonChromeScriptURI() {
      try {
        let chromeDir;
        try {
          chromeDir = ServicesRef.dirsvc.get("UChrm", CiRef.nsIFile);
        } catch (_err) {
          chromeDir = ServicesRef.dirsvc.get("ProfD", CiRef.nsIFile);
          chromeDir.append("chrome");
        }

        const scriptFile = chromeDir.clone();
        scriptFile.append("dragon-chrome.uc.js");
        if (!scriptFile.exists() || !scriptFile.isFile()) {
          return null;
        }

        let dirURI = ServicesRef.io.newFileURI(chromeDir);
        if (!dirURI.spec.endsWith("/")) {
          dirURI = ServicesRef.io.newURI(dirURI.spec + "/");
        }

        const resProto = ServicesRef.io
          .getProtocolHandler("resource")
          .QueryInterface(CiRef.nsIResProtocolHandler);
        resProto.setSubstitution("dragon-chrome", dirURI);

        return "resource://dragon-chrome/dragon-chrome.uc.js?v=" + scriptFile.lastModifiedTime;
      } catch (err) {
        Components.utils.reportError(
          "[Dragon AutoConfig] Unable to resolve resource://dragon-chrome/dragon-chrome.uc.js: " + err
        );
        return null;
      }
    }

    function loadDragonChromeIntoWindow(win) {
      try {
        if (!win || win.__dragonChromeLoaded) {
          return;
        }
        const href = win.location ? win.location.href : "";
        if (href !== "chrome://browser/content/browser.xhtml") {
          return;
        }
        const scriptURI = resolveDragonChromeScriptURI();
        if (!scriptURI) {
          return;
        }
        win.__dragonChromeLoaded = true;
        ServicesRef.scriptloader.loadSubScript(scriptURI, win);
      } catch (loadErr) {
        Components.utils.reportError(
          "[Dragon AutoConfig] Failed to load dragon-chrome.uc.js: " + loadErr
        );
      }
    }

    const dragonChromeObserver = {
      observe(subject, topic) {
        try {
          const win = subject;
          if (!win) {
            return;
          }

          if (topic === "chrome-document-global-created") {
            if (typeof win.addEventListener !== "function") {
              return;
            }
            win.addEventListener(
              "DOMContentLoaded",
              function onDragonDOMContentLoaded() {
                loadDragonChromeIntoWindow(win);
              },
              { once: true }
            );
          } else if (topic === "browser-delayed-startup-finished") {
            loadDragonChromeIntoWindow(win);
          }
        } catch (obsErr) {
          Components.utils.reportError(
            "[Dragon AutoConfig] Observer error: " + obsErr
          );
        }
      },
    };

    if (!globalThis.__dragonAutoConfigRegistered) {
      globalThis.__dragonAutoConfigRegistered = true;
      globalThis.__dragonAutoConfigObserver = dragonChromeObserver;
      ServicesRef.obs.addObserver(
        dragonChromeObserver,
        "chrome-document-global-created",
        false
      );
      ServicesRef.obs.addObserver(
        dragonChromeObserver,
        "browser-delayed-startup-finished",
        false
      );
    }
  } catch (err) {
    try {
      Components.utils.reportError(
        "[Dragon AutoConfig] Initialization error: " + err
      );
    } catch (_ignored) {}
  }
})();
