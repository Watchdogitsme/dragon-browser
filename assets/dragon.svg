<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Dragon Browser">
  <defs>
    <linearGradient id="dragon-bg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171923"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="dragon-ember" x1="24" y1="22" x2="104" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="52%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="dragon-highlight" x1="36" y1="24" x2="96" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffb067"/>
      <stop offset="100%" stop-color="#ff4d4f"/>
    </linearGradient>
  </defs>

  <!-- Faceted Obsidian Hex Shield -->
  <polygon
    points="64,6 114,35 114,93 64,122 14,93 14,35"
    fill="url(#dragon-bg)"
    stroke="#272b3b"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Outer Geometric Dragon Wing / Crest -->
  <path
    d="M32 88 L42 40 L68 24 L94 34 L76 44 L98 54 L76 62 L92 78 L62 102 L48 92 L66 76 L50 74 Z"
    fill="url(#dragon-ember)"
  />

  <!-- Upper Facet Highlight (Horns & Brow) -->
  <polygon
    points="42,40 68,24 94,34 66,46 50,52"
    fill="url(#dragon-highlight)"
  />

  <!-- Inner Negative-Space Shadow Cut -->
  <polygon
    points="50,74 66,76 58,86 44,82"
    fill="#0e1017"
    opacity="0.72"
  />

  <!-- Sharp Ember Eye -->
  <polygon
    points="63,49 75,45 71,54"
    fill="#fff5eb"
  />
</svg>
